<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TAYTV — Live Broadcast</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --accent: #6EC9E0;
    --accent-dim: #6EC9E033;
    --bg: #08080b;
    --panel: #101014;
    --ink: #f4f2ea;
    --ink-dim: #a8a6ac;
    --red: #ff2e4d;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    overflow:hidden;
  }

  #app{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:#000;
  }

  /* ---------- VIDEO STAGE ---------- */
  #stage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden; /* clips the zoomed video below so it can't spill out */
  }

  /* Zoom-and-crop: the video is rendered ~11% taller than its box and
     shifted up, so the top ~9% (YouTube's hover title bar) and bottom ~1%
     (a sliver of its own info text) get pushed outside the visible frame
     and clipped by #stage's overflow:hidden — same idea as a browser zoom,
     just applied to only the video. The bottom crop is kept small on
     purpose: the "Skip Ad" button lives close to that same edge, and
     cropping enough to fully hide YouTube's tiny "Sponsored..." text next
     to it would risk cropping the Skip button too, so this leans toward
     keeping Skip clickable over hiding that last bit of text. */
  #playerFrame{ position:absolute; inset:0; overflow:hidden; }
  /* The iframe's actual position/size/zoom is set in JS (see applyIframeZoom
     below) rather than fixed CSS, because it depends on the live pixel size
     of #stage and needs to recompute on resize. */
  #playerFrame iframe{ position:absolute; pointer-events:auto; }
  /* Local mp4 lyric videos fill the same box the iframe would, no zoom hack
     needed since there's no YouTube chrome to shrink. */
  #playerFrame video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }

  /* Full-coverage shield: blocks all clicks/hover on the video (no pause,
     no seek, no hover-triggered YouTube UI, no way to click Skip Ad —
     ads are instead escaped via the Refresh button, see refreshStream()). */
  #shield{
    position:absolute; inset:0; z-index:5; cursor:default; background:transparent;
  }

  /* Brief black fade used only for channel-change transitions */
  #flash{ position:absolute; inset:0; z-index:9; pointer-events:none; background:#000; opacity:0; }
  #flash.burst{ animation: flashBurst .5s ease-out 1; }
  @keyframes flashBurst{ 0%{ opacity:1; } 100%{ opacity:0; } }

  #bumper{
    position:absolute; inset:0; z-index:8; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    background:#08080b; opacity:0;
  }
  #bumper .bumper-logo{ font-family:'Anton', sans-serif; font-size:clamp(28px, 6vw, 56px); letter-spacing:2px; color:var(--ink); }
  #bumper .bumper-logo span{ color:var(--accent); }
  #bumper .bumper-ch{
    margin-top:10px; font-family:'JetBrains Mono', monospace; font-size:12px;
    letter-spacing:3px; color:var(--ink-dim); text-transform:uppercase;
  }

  /* ---------- ON-SCREEN CHROME (auto-hides) ---------- */
  #chrome{ transition: opacity .5s ease; opacity:1; }
  #chrome.faded{ opacity:0; }

  #bug{
    position:absolute; top:22px; left:22px; z-index:15;
    display:flex; align-items:center; gap:10px;
    font-family:'Anton', sans-serif; letter-spacing:1px;
    padding:8px 14px 8px 10px; background:var(--panel);
    border:1px solid rgba(255,255,255,0.12); border-radius:8px;
  }
  #bug .num{
    font-size:11px; color:var(--accent); font-family:'JetBrains Mono', monospace;
    letter-spacing:0; border-right:1px solid rgba(255,255,255,.15); padding-right:9px;
  }
  #bug .name{ font-size:15px; }
  #bug .name span{ color:var(--accent); }

  #live{
    position:absolute; top:22px; right:22px; z-index:15;
    display:flex; align-items:center; gap:14px;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-dim);
  }
  #live .dot-wrap{ display:flex; align-items:center; gap:6px; color:var(--red); font-weight:700; letter-spacing:1px; }
  #live .dot{ width:8px; height:8px; border-radius:50%; background:var(--red); animation: pulse 1.4s infinite ease-in-out; }
  @keyframes pulse{
    0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(255,46,77,.5); }
    50%{ opacity:.55; box-shadow:0 0 0 6px rgba(255,46,77,0); }
  }
  #clock{ letter-spacing:1px; }
  #viewers{ letter-spacing:.5px; }

  /* ---------- REMOTE-STYLE VOLUME / CHANNEL CONTROLS ---------- */
  #chCtrlGroup{
    position:absolute; top:50%; right:16px; transform:translateY(-50%); z-index:16;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .tvctrl{
    display:flex; flex-direction:column; align-items:center;
    background:var(--panel);
    border:1px solid rgba(255,255,255,0.12); border-radius:16px;
    width:50px; overflow:hidden;
  }
  .tvctrl-left{ position:absolute; top:50%; left:16px; transform:translateY(-50%); z-index:16; }
  .tvctrl-refresh{
    background:var(--panel); border:1px solid rgba(255,255,255,0.12); border-radius:16px;
    width:50px; padding:10px 0 9px 0; cursor:pointer; color:var(--ink-dim);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition: background .15s ease, color .15s ease;
  }
  .tvctrl-refresh:hover{ background:rgba(255,255,255,0.08); color:var(--ink); }
  .tvctrl-refresh:active{ transform:scale(0.94); }
  .tvctrl-refresh svg{ width:16px; height:16px; }
  .tvctrl-refresh.spinning svg{ animation: refreshSpin .6s linear; }
  @keyframes refreshSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .tvctrl-refresh span{
    font-family:'JetBrains Mono', monospace; font-size:8px; letter-spacing:1.5px;
  }
  .tvctrl-arrow{
    background:none; border:none; color:var(--ink-dim); width:100%;
    padding:12px 0; cursor:pointer; line-height:1; transition: background .15s ease, color .15s ease;
  }
  .tvctrl-arrow svg{ width:14px; height:14px; display:block; margin:0 auto; }
  .tvctrl-arrow:hover{ background:rgba(255,255,255,0.08); color:var(--ink); }
  .tvctrl-arrow:active{ transform:scale(0.9); }
  .tvctrl-mid{
    background:none; border:none; width:100%;
    border-top:1px solid rgba(255,255,255,.1); border-bottom:1px solid rgba(255,255,255,.1);
    color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:700;
    padding:10px 2px; cursor:pointer; letter-spacing:.5px; text-align:center;
  }
  .tvctrl-mid:hover{ background:rgba(255,255,255,0.06); }
  .tvctrl-mid.muted{ color:var(--red); }
  .tvctrl-label{
    font-family:'JetBrains Mono', monospace; font-size:8px; letter-spacing:2px; color:var(--ink-dim);
    text-transform:uppercase; text-align:center; padding:6px 0 8px 0;
  }

  #guideHint{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:15;
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:var(--ink-dim); background:var(--panel);
    padding:7px 14px; border-radius:999px; border:1px solid rgba(255,255,255,0.12);
    display:flex; align-items:center; gap:8px; cursor:pointer;
  }
  #guideHint svg{ width:12px; height:12px; }

  #lowerthird{ position:absolute; left:0; right:0; bottom:60px; z-index:15; pointer-events:none; }
  #nowbar{ margin:0 22px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; }
  #nowplaying-block{
    background:var(--panel); border-left:4px solid var(--accent);
    border-radius:4px; padding:12px 18px; max-width:70%;
  }
  #np-eyebrow{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; margin-bottom:4px; }
  #np-title{ font-family:'Anton', sans-serif; font-size:clamp(20px,3.4vw,34px); letter-spacing:.5px; line-height:1; }
  #np-era{ margin-top:4px; font-size:12px; color:var(--ink-dim); font-weight:600; }
  #upnext-block{
    background:var(--panel); border-radius:4px;
    padding:10px 16px; text-align:right; min-width:180px;
  }
  #upnext-block.hidden{ display:none; }
  #un-eyebrow{ font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:2px; color:var(--ink-dim); text-transform:uppercase; margin-bottom:3px; }
  #un-title{ font-size:14px; font-weight:700; }

  .guide-group-label{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:3px; color:var(--ink-dim);
    text-transform:uppercase; padding:16px 22px 8px 22px;
  }
  .guide-row{
    display:flex; align-items:center; gap:14px; padding:11px 22px; cursor:pointer;
    border-left:3px solid transparent; transition: background .15s ease;
  }
  .guide-row:hover{ background:rgba(255,255,255,0.04); }
  .guide-row.active{ background:var(--accent-dim); border-left-color:var(--accent); }
  .guide-ch-num{
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--ink-dim);
    width:38px; flex:0 0 auto;
  }
  .guide-row.active .guide-ch-num{ color:var(--accent); font-weight:700; }
  .guide-ch-info{ flex:1; min-width:0; }
  .guide-ch-name{ font-size:14px; font-weight:700; }
  .guide-ch-now{ font-size:11px; color:var(--ink-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- CHANNEL GUIDE OVERLAY (slides in from the right) ----------- */
  #guideOverlay{
    position:fixed; inset:0; z-index:60;
    display:flex; align-items:stretch; justify-content:flex-end;
    opacity:0; visibility:hidden; pointer-events:none;
    transition: opacity .3s ease, visibility .3s ease;
  }
  #guideOverlay.open{ opacity:1; visibility:visible; pointer-events:auto; }
  #guideOverlayBackdrop{
    position:absolute; inset:0; background:rgba(4,4,6,0.82);
  }
  #guideOverlayPanel{
    position:relative; z-index:1; width:min(440px, 92vw); height:100%;
    background:var(--panel); border-left:1px solid rgba(255,255,255,0.08);
    border-radius:18px 0 0 18px; overflow:hidden;
    display:flex; flex-direction:column;
    transform:translateX(100%); transition: transform .3s ease;
    box-shadow:-20px 0 60px rgba(0,0,0,.5);
  }
  #guideOverlay.open #guideOverlayPanel{ transform:translateX(0); }
  #guideOverlayHeader{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 24px 16px 26px; border-bottom:1px solid rgba(255,255,255,0.08);
    flex:0 0 auto;
  }
  #guideOverlayHeader h2{ font-family:'Anton', sans-serif; font-size:24px; letter-spacing:1px; }
  #guideOverlayClose{
    background:none; border:none; color:var(--ink-dim); font-size:22px; line-height:1; cursor:pointer;
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    transition: background .15s ease, color .15s ease;
  }
  #guideOverlayClose:hover{ background:rgba(255,255,255,0.08); color:var(--ink); }
  #guideOverlayList{ overflow-y:auto; padding:6px 0 24px 0; flex:1 1 auto; }

  @media (max-width:640px){
    #guideOverlayPanel{ width:100%; border-radius:0; }
    #bug .name{ font-size:12px; }
    #bug .num{ font-size:9px; padding-right:6px; }
    #live{ font-size:10px; gap:8px; }
    #nowbar{ flex-direction:column; align-items:flex-start; }
    #nowplaying-block{ max-width:100%; }
    #upnext-block{ text-align:left; }
    #np-title{ font-size:20px; }
    #guideHint{ font-size:9px; padding:6px 12px; }
    .tvctrl{ width:40px; border-radius:12px; }
    .tvctrl-left{ left:10px; }
    #chCtrlGroup{ right:10px; gap:8px; }
    .tvctrl-refresh{ width:40px; border-radius:12px; padding:8px 0 7px 0; }
    .tvctrl-arrow{ padding:9px 0; }
    .tvctrl-mid{ font-size:10px; padding:8px 2px; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="stage">
    <div id="playerFrame"></div>
    <div id="shield"></div>
    <div id="flash"></div>
    <div id="bumper"><div><div class="bumper-logo">TAY<span>TV</span></div><div class="bumper-ch" id="bumperCh"></div></div></div>
  </div>

  <div id="chrome">
    <div id="bug">
      <span class="num" id="bugNum">CH.1</span>
      <span class="name">TAY<span>TV</span></span>
    </div>

    <div id="live">
      <span class="dot-wrap"><span class="dot"></span> ON AIR</span>
      <span id="viewers">— watching</span>
      <span id="clock">--:--:--</span>
    </div>

    <div id="lowerthird">
      <div id="nowbar">
        <div id="nowplaying-block">
          <div id="np-eyebrow">Now Broadcasting</div>
          <div id="np-title">Tuning in…</div>
          <div id="np-era"></div>
        </div>
        <div id="upnext-block">
          <div id="un-eyebrow">Up Next</div>
          <div id="un-title">—</div>
        </div>
      </div>
    </div>

    <div id="guideHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      Scroll Down for All Channels
    </div>

    <div id="volCtrl" class="tvctrl tvctrl-left">
      <button id="volUp" class="tvctrl-arrow" aria-label="Volume Up">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <button id="volMid" class="tvctrl-mid" aria-label="Mute"><span id="volVal">10</span></button>
      <button id="volDown" class="tvctrl-arrow" aria-label="Volume Down">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="tvctrl-label">VOL</div>
    </div>

    <div id="chCtrlGroup">
      <div id="chCtrl" class="tvctrl">
        <button id="chUp" class="tvctrl-arrow" aria-label="Channel Up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <button id="chMid" class="tvctrl-mid" aria-label="Current Channel"><span id="chVal">1</span></button>
        <button id="chDown" class="tvctrl-arrow" aria-label="Channel Down">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="tvctrl-label">CH</div>
      </div>

      <button id="refreshBtn" class="tvctrl-refresh" aria-label="Refresh Stream" title="Ad taking too long? Try refreshing.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>REFRESH</span>
      </button>
    </div>
  </div>


</div>

<div id="guideOverlay">
  <div id="guideOverlayBackdrop"></div>
  <div id="guideOverlayPanel">
    <div id="guideOverlayHeader">
      <h2>ALL CHANNELS</h2>
      <button id="guideOverlayClose" aria-label="Close channel guide">✕</button>
    </div>
    <div id="guideOverlayList"></div>
  </div>
</div>

<script>
/* =========================================================================
   TAYTV — a multi-channel, 24/7 "always-on" broadcast network.
   Every channel runs on its own fixed, wall-clock-driven schedule (like
   real live TV): whichever channel you tune to, you land mid-song, right
   where the broadcast "actually is" — there's no pause/seek, and each
   channel just keeps rolling forever.
   ========================================================================= */

const EPOCH = new Date('2024-01-01T00:00:00Z').getTime();

// ---- GLOBAL CLOCK -------------------------------------------------------
// The broadcast must land on the exact same video/offset for every viewer,
// everywhere, even if a viewer's device clock is wrong or has been changed
// on purpose. So instead of trusting Date.now(), we fetch true UTC time
// from a public time server once, then track the passage of time using
// performance.now() — a monotonic clock that keeps ticking steadily and is
// NOT affected by someone changing their system clock mid-session. We
// re-sync periodically to correct for any small drift over a long session.
let timeAnchorEpoch = Date.now();     // best-effort fallback until synced
let timeAnchorPerf = performance.now();
let clockSynced = false;

async function fetchServerEpoch(){
  const attempts = [
    async ()=>{
      // Cloudflare's edge responds to every request with a precise server
      // timestamp — extremely reliable and effectively globally distributed,
      // so this is tried first.
      const t0 = performance.now();
      const res = await fetch('https://cloudflare.com/cdn-cgi/trace', {cache:'no-store'});
      const text = await res.text();
      const t1 = performance.now();
      const match = text.match(/ts=([\d.]+)/);
      if(!match) throw new Error('no ts in trace');
      return { epoch: parseFloat(match[1]) * 1000 + (t1-t0)/2, perf: t1 };
    },
    async ()=>{
      const t0 = performance.now();
      const res = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC', {cache:'no-store'});
      const data = await res.json();
      const t1 = performance.now();
      return { epoch: data.unixtime*1000 + (t1-t0)/2, perf: t1 };
    },
    async ()=>{
      const t0 = performance.now();
      const res = await fetch('https://worldclockapi.com/api/json/utc/now', {cache:'no-store'});
      const data = await res.json();
      const t1 = performance.now();
      const epoch = new Date(data.currentDateTime).getTime();
      return { epoch: epoch + (t1-t0)/2, perf: t1 };
    },
  ];
  for(const attempt of attempts){
    try{
      const { epoch, perf } = await attempt();
      if(Number.isFinite(epoch)){
        timeAnchorEpoch = epoch;
        timeAnchorPerf = perf;
        clockSynced = true;
        return true;
      }
    }catch(err){ /* try next source */ }
  }
  return false;
}

// True-time "now" in epoch ms — same value for every viewer regardless of
// their device's wall clock, once synced.
function now(){
  return timeAnchorEpoch + (performance.now() - timeAnchorPerf);
}

fetchServerEpoch();                       // sync immediately on load
setInterval(fetchServerEpoch, 10*60*1000); // and periodically after that

// ---- CHANNEL DEFINITIONS ----------------------------------------------
// duration = approx runtime in seconds, only used to compute where to
// "tune in" mid-song — actual advances are driven by the real YouTube
// 'ended' event, so drift never accumulates for long.
const CHANNELS = {

      { title:"Change", id:"B1jYllE0T-k", duration:225, era:"Fearless", accent:"#F4C95D" },
      { title:"Love Story", id:"8xg3vE8Ie_E", duration:225, era:"Fearless", accent:"#F4C95D" },
      { title:"White Horse", id:"D1Xr-JFLxik", duration:225, era:"Fearless", accent:"#F4C95D" },
      { title:"You Belong With Me", id:"VuNIsY6JdUw", duration:225, era:"Fearless", accent:"#F4C95D" },

// ---- SCHEDULE MATH ------------------------------------------------------
function getBroadcastState(songs, atTime){
  const total = songs.reduce((s,v)=>s+v.duration,0);
  const elapsed = ((atTime - EPOCH) / 1000) % total;
  let acc = 0;
  for(let i=0;i<songs.length;i++){
    if(elapsed < acc + songs[i].duration){
      return { index:i, offset: elapsed - acc };
    }
    acc += songs[i].duration;
  }
  return { index:0, offset:0 };
}

// ---- DOM refs -------------------------------------------------------------
const $ = (id)=>document.getElementById(id);
const stageEl = $('stage');
const npTitle = $('np-title'), npEra = $('np-era'), unTitle = $('un-title'), upnextBlock = $('upnext-block');
const clockEl = $('clock'), viewersEl = $('viewers');
const flashEl = $('flash');
const bumperEl = $('bumper'), bumperCh = $('bumperCh');
const bugNum = $('bugNum'), chVal = $('chVal');
const chromeEl = $('chrome');
const root = document.documentElement;

let bumperHideTimer = null;
let bumperArmed = false; // true from the moment a transition starts until the first PLAYING after it

function showBumper(channel){
  bumperCh.textContent = "CH. " + channel.number + " · " + channel.name;
  clearTimeout(bumperHideTimer);
  bumperEl.style.transition = 'none';
  bumperEl.style.opacity = '1';
  void bumperEl.offsetWidth;
  bumperArmed = true;
  // Safety net: if PLAYING never fires (a broken video, stalled buffering,
  // etc.) don't leave the screen blacked out forever.
  bumperHideTimer = setTimeout(hideBumper, 4000);
}

function hideBumper(){
  bumperArmed = false;
  clearTimeout(bumperHideTimer);
  bumperEl.style.transition = 'opacity .6s ease';
  bumperEl.style.opacity = '0';
}

// Called once playback of the new video actually begins — holds the bumper
// up briefly so the viewer never sees YouTube's own title/pause overlay
// flash in before it fades on its own.
function armedBumperSawPlaying(){
  if(!bumperArmed) return;
  bumperArmed = false;
  clearTimeout(bumperHideTimer);
  bumperHideTimer = setTimeout(hideBumper, 800);
}

function applyEra(song){
  root.style.setProperty('--accent', song.accent);
  root.style.setProperty('--accent-dim', song.accent + '33');
}

function renderNowPlaying(){
  const channel = CHANNELS[currentChannelNum];
  const songs = channel.songs;
  const song = songs[currentIndex];
  const next = songs[(currentIndex+1) % songs.length];
  applyEra(song);
  bugNum.textContent = "CH." + channel.number;
  chVal.textContent = channel.number;
  npTitle.textContent = song.title;
  npEra.textContent = "CH." + channel.number + " · " + channel.name + " · " + song.era;
  if(songs.length > 1){
    upnextBlock.classList.remove('hidden');
    unTitle.textContent = next.title;
  } else {
    upnextBlock.classList.add('hidden');
  }
  document.title = "🔴 CH." + channel.number + " " + song.title + " — TAYTV";
}

  clockEl.textContent = new Date(now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});

tickClock();

  viewerBase += Math.floor(Math.random()*90) - 40;
  if(viewerBase < 1000) viewerBase = 1000;
  viewersEl.textContent = viewerBase.toLocaleString() + " watching";

// resync check skips itself during this window so it can't race the load

fetchServerEpoch().then(()=>{

// ---- "Zoom out" the YouTube player itself (Ctrl+- effect, video-only) ---
// YouTube's own title/buttons/skip-ad UI shrink and simplify based on how
// big it THINKS its player is — same reason those get smaller if you
// zoom the whole browser page out. This renders the iframe internally at
// YT_ZOOM × its real size, then scales it back up with CSS zoom to land in
// exactly the same visual box as before (same crop math as always: 111.11%
// height / -10% top, to keep YouTube's title bar cropped off).
// Turn this down (e.g. 0.25) for an even more minimal/compact YouTube UI —
// the tradeoff is YouTube also serves a lower-res stream the smaller it
// thinks its player is, so the video gets a bit softer as this goes down.
const YT_ZOOM = 0.4;
const CROP_HEIGHT_SCALE = 1.0; // no crop — full-height fill
const CROP_TOP_FRACTION = 0;   // no shift — normal position

function applyIframeZoom(){
  if(!player || !player.getIframe) return;
  const iframe = player.getIframe();
  if(!iframe) return;
  const rect = stageEl.getBoundingClientRect();
  if(!rect.width || !rect.height) return;

  const visualWidth = rect.width;
  const visualHeight = rect.height * CROP_HEIGHT_SCALE;
  const visualTop = -rect.height * CROP_TOP_FRACTION;

  iframe.style.left = '0px';
  iframe.style.top = (visualTop / YT_ZOOM) + 'px';
  iframe.style.width = (visualWidth / YT_ZOOM) + 'px';
  iframe.style.height = (visualHeight / YT_ZOOM) + 'px';
  iframe.style.zoom = YT_ZOOM;
}

let zoomResizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(zoomResizeTimer);
  zoomResizeTimer = setTimeout(applyIframeZoom, 150);
});

function isLocalSong(song){ return !!song.local; }

function destroyCurrentPlayer(){
  if(playerKind === 'youtube' && player && player.destroy){
    try{ player.destroy(); }catch(e){}
  }
  if(playerKind === 'local' && player && player._el){
    player._el.pause();
    player._el.removeAttribute('src');
    player._el.load();
    player._el.remove();
  }
  player = null;
  playerKind = null;
}

// A local <video> wrapped so it exposes the same handful of calls the rest
// of the app already uses on the YouTube player (playVideo, seekTo,
// getCurrentTime, getPlayerState, setVolume, mute/unMute, getIframe) — the
// numeric state codes match YT.PlayerState's own values (ENDED:0, PLAYING:1,
// PAUSED:2, BUFFERING:3) so every existing comparison against YT.PlayerState
// still works untouched.
function createLocalPlayer(song, startSeconds){
  const container = document.getElementById('playerFrame');
  container.innerHTML = '';
  const videoEl = document.createElement('video');
  videoEl.src = 'midnights/' + song.local;
  videoEl.muted = true; // starts muted like the YouTube path — unmuteOnFirstInteraction handles the rest
  videoEl.playsInline = true;
  videoEl.controls = false;
  videoEl.autoplay = true;
  container.appendChild(videoEl);

  const wrapper = {
    _el: videoEl,
    playVideo(){ videoEl.play().catch(()=>{}); },
    seekTo(sec){ try{ videoEl.currentTime = sec; }catch(e){} },
    getCurrentTime(){ return videoEl.currentTime || 0; },
    getPlayerState(){
      if(videoEl.ended) return 0;          // YT.PlayerState.ENDED
      if(videoEl.paused) return 2;         // YT.PlayerState.PAUSED
      if(videoEl.readyState < 3) return 3; // YT.PlayerState.BUFFERING
      return 1;                            // YT.PlayerState.PLAYING
    },
    setVolume(v){ videoEl.volume = Math.max(0, Math.min(100, v)) / 100; },
    mute(){ videoEl.muted = true; },
    unMute(){ videoEl.muted = false; },
    getIframe(){ return null; }, // tells applyIframeZoom() there's nothing to zoom — local files fill the box via CSS instead
    destroy(){ videoEl.pause(); videoEl.remove(); }
  };

  videoEl.addEventListener('loadedmetadata', ()=>{
    if(startSeconds) { try{ videoEl.currentTime = startSeconds; }catch(e){} }
  }, { once:true });
  videoEl.addEventListener('playing', ()=> onPlayerStateChange({ data:1, target:wrapper }));
  videoEl.addEventListener('pause',   ()=> onPlayerStateChange({ data:2, target:wrapper }));
  videoEl.addEventListener('waiting', ()=> onPlayerStateChange({ data:3, target:wrapper }));
  videoEl.addEventListener('ended',   ()=> onPlayerStateChange({ data:0, target:wrapper }));
  // A missing/broken local file behaves just like an unembeddable YouTube
  // video: skip it and blacklist that slot for the rest of the session.
  videoEl.addEventListener('error', ()=> advanceToNext(true));

  return wrapper;
}

function createYouTubePlayer(song, startSeconds){
  return new YT.Player('playerFrame', {
    host: 'https://www.youtube-nocookie.com',
    videoId: song.id,
    playerVars: {
      // Starts muted: browsers block autoplay-with-sound unless it's in
      // response to a user gesture, and we're now autoplaying immediately
      // on page load with no "Tune In" click to anchor to. unmuteOnFirstInteraction
      // below unmutes it the moment the visitor does anything on the page.
      autoplay: 1, mute: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, fs: 0,
      iv_load_policy: 3, cc_load_policy: 0, playsinline: 1,
      start: Math.floor(startSeconds), origin: window.location.origin
    },
    events: {
      onReady: (e)=>{
        e.target.playVideo(); applyVolumeToPlayer(); startResync();
        applyIframeZoom();
        setTimeout(applyIframeZoom, 300); // iframe isn't always laid out yet on the first tick
      },
      onStateChange: onPlayerStateChange,
      onApiChange: (e)=>{
        try{
          const opts = e.target.getOptions();
          if(opts && opts.indexOf && opts.indexOf('captions') !== -1){
            e.target.setOption('captions', 'track', {});
            e.target.unloadModule('captions');
          }
        }catch(err){}
      },
      onError: ()=> advanceToNext(true)
    }
  });
}

// The single entry point everything else calls to play a song, regardless
// of whether it's a YouTube video or a local file. Reuses the existing
// engine in place when possible (fast path — same as the old loadVideoById
// calls); tears down and rebuilds only when actually switching engines
// (e.g. tuning from a YouTube channel into the local Midnights lyrics one).
function loadSong(song, startSeconds){
  const wantKind = isLocalSong(song) ? 'local' : 'youtube';

  if(wantKind === 'youtube' && playerKind === 'youtube' && player && player.loadVideoById){
    player.loadVideoById({ videoId: song.id, startSeconds: Math.floor(startSeconds || 0) });
    applyIframeZoom();
    return;
  }
  if(wantKind === 'local' && playerKind === 'local' && player && player._el){
    player._el.src = 'midnights/' + song.local;
    player._el.currentTime = startSeconds || 0;
    player.playVideo();
    return;
  }

  destroyCurrentPlayer();

  if(wantKind === 'local'){
    playerKind = 'local';
    player = createLocalPlayer(song, startSeconds || 0);
    player.playVideo();
    applyVolumeToPlayer();
    startResync();
  } else {
    playerKind = 'youtube';
    player = createYouTubePlayer(song, startSeconds || 0);
    // onReady above handles play/volume/resync/zoom for this path.
  }
}

function createPlayer(){
  const channel = CHANNELS[currentChannelNum];
  const state = getBroadcastState(channel.songs, now());
  currentIndex = state.index;
  beginTransition();
  renderNowPlaying();
  showBumper(channel);
  loadSong(channel.songs[currentIndex], state.offset);
}

let transitionSafetyTimer = null;
function beginTransition(){
  isTransitioning = true;
  clearTimeout(transitionSafetyTimer);
  // Safety net: if PLAYING never fires (e.g. an unusual player state), don't
  // leave the resync check disabled forever.
  transitionSafetyTimer = setTimeout(()=>{ isTransitioning = false; }, 6000);
}
function endTransition(){
  isTransitioning = false;
  clearTimeout(transitionSafetyTimer);
}

let lastForcedPlayAt = 0;
function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.PLAYING){ endTransition(); armedBumperSawPlaying(); }
  if(e.data === YT.PlayerState.ENDED) advanceToNext(false);
  if(e.data === YT.PlayerState.PAUSED){
    // Live TV can't be paused — but only nudge it at most once a second.
    // Without this throttle, a paused/buffering ad can get forced to
    // replay repeatedly, which looks like the video "restarting."
    const t = Date.now();
    if(t - lastForcedPlayAt > 1000){
      lastForcedPlayAt = t;
      e.target.playVideo();
    }
  }
}

function transitionBurst(){
  flashEl.classList.remove('burst');
  void flashEl.offsetWidth;
  flashEl.classList.add('burst');
}

function nextLiveIndex(chNum, fromIndex){
  const songs = CHANNELS[chNum].songs;
  const dead = deadSet(chNum);
  if(dead.size >= songs.length) return -1;
  let i = fromIndex;
  do{ i = (i + 1) % songs.length; } while(dead.has(i));
  return i;
}

function advanceToNext(fromError){
  if(fromError) deadSet(currentChannelNum).add(currentIndex);
  const next = nextLiveIndex(currentChannelNum, currentIndex);
  if(next === -1){
    npTitle.textContent = "Technical Difficulties";
    npEra.textContent = "Please check back shortly";
    return;
  }
  beginTransition();
  transitionBurst();
  currentIndex = next;
  const channel = CHANNELS[currentChannelNum];
  renderNowPlaying();
  showBumper(channel);
  setTimeout(()=>{
    loadSong(channel.songs[currentIndex], 0);
  }, fromError ? 400 : 250);
}

// Keep the broadcast honest to the wall clock on the current channel.
function startResync(){
  if(resyncInterval) clearInterval(resyncInterval);
  resyncInterval = setInterval(()=>{
    // Never fight an in-flight song/channel change, and don't touch a
    // player that's buffering or hasn't started — that combination was
    // what caused videos to cut off early or visibly restart.
    if(isTransitioning) return;
    if(!player || !player.getCurrentTime || !player.getPlayerState) return;
    const playerState = player.getPlayerState();
    if(playerState === YT.PlayerState.BUFFERING || playerState === YT.PlayerState.UNSTARTED) return;

    const channel = CHANNELS[currentChannelNum];
    const songs = channel.songs;
    const state = getBroadcastState(songs, now());

    if(state.index !== currentIndex){
      // Song lengths in the schedule are approximate, so the wall-clock
      // index and the actually-playing index will drift apart by a song
      // or so during totally normal playback — that's fine, the natural
      // YouTube "ended" event is the accurate source of truth for that.
      // Only force a hard reload if we're badly out of sync (e.g. the tab
      // was backgrounded/throttled for a while).
      const rawDiff = Math.abs(state.index - currentIndex);
      const indexDiff = Math.min(rawDiff, songs.length - rawDiff);
      if(indexDiff > 1 && !deadSet(currentChannelNum).has(state.index)){
        beginTransition();
        currentIndex = state.index;
        renderNowPlaying();
        showBumper(channel);
        loadSong(songs[currentIndex], state.offset);
      }
      return;
    }

    const drift = Math.abs(player.getCurrentTime() - state.offset);
    if(drift > 6) player.seekTo(state.offset, true);
  }, 5000);
}

function tuneToChannel(num){
  if(num === currentChannelNum) return;
  currentChannelNum = num;
  const channel = CHANNELS[num];
  const state = getBroadcastState(channel.songs, now());
  currentIndex = state.index;
  beginTransition();
  transitionBurst();
  renderNowPlaying();
  showBumper(channel);
  loadSong(channel.songs[currentIndex], state.offset);
  renderGuideList();
}

// ---- Interaction shield: no pausing, no seeking, no right-click, except
// in the small bottom-right notch cut out above for the ad-skip button.
const shield = $('shield');
shield.addEventListener('click', (e)=>e.preventDefault());
shield.addEventListener('contextmenu', (e)=>e.preventDefault());
document.addEventListener('keydown', (e)=>{
  if([' ','k','K','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
// The keydown guard above only fires while focus stays on the top-level
// page. A click into the notch hands the iframe keyboard focus too, which
// would let it catch space/arrow presses before this page ever sees them —
// so pull focus straight back whenever it leaves.
window.addEventListener('blur', ()=>{
  if(document.activeElement && document.activeElement.tagName === 'IFRAME'){
    setTimeout(()=> window.focus(), 0);
  }
});
// Belt-and-suspenders: if playback gets paused anyway (a click landing in
// the notch during normal, non-ad content), onPlayerStateChange below
// force-resumes it the moment YouTube reports PAUSED.

// ---- Auto-hiding chrome: bug / live badge / lower third ----------------
let chromeTimer = null;
function wakeChrome(){
  chromeEl.classList.remove('faded');
  clearTimeout(chromeTimer);
  chromeTimer = setTimeout(()=> chromeEl.classList.add('faded'), 3800);
}
['mousemove','mousedown','touchstart','keydown'].forEach(evt=>{
  document.addEventListener(evt, wakeChrome, {passive:true});
});
wakeChrome();

// ---- Channel guide: a single, larger overlay that pops up on top --------
const guideOverlay = $('guideOverlay');
const guideOverlayList = $('guideOverlayList');

function renderGuideList(){
  guideOverlayList.innerHTML = '';
  GUIDE_ORDER.forEach(group=>{
    const label = document.createElement('div');
    label.className = 'guide-group-label';
    label.textContent = group.label;
    guideOverlayList.appendChild(label);
    group.ids.forEach(id=>{
      const channel = CHANNELS[id];
      const state = getBroadcastState(channel.songs, now());
      const nowSong = channel.songs[state.index];
      const row = document.createElement('div');
      row.className = 'guide-row' + (id === currentChannelNum ? ' active' : '');
      row.innerHTML =
        '<div class="guide-ch-num">' + id + '</div>' +
        '<div class="guide-ch-info">' +
          '<div class="guide-ch-name">' + channel.name + '</div>' +
          '<div class="guide-ch-now">NOW: ' + nowSong.title + '</div>' +
        '</div>';
      row.addEventListener('click', ()=>{
        tuneToChannel(id);
        closeGuideOverlay();
      });
      guideOverlayList.appendChild(row);
    });
  });
}
renderGuideList();
// Keep "NOW:" text fresh even for channels you're not currently watching —
// but not while the overlay is open, so it doesn't reset the user's scroll
// position in the list mid-browse.
setInterval(()=>{ if(!guideOverlay.classList.contains('open')) renderGuideList(); }, 20000);

function guideIsOpen(){ return guideOverlay.classList.contains('open'); }
function openGuideOverlay(){
  renderGuideList();
  guideOverlay.classList.add('open');
}
function closeGuideOverlay(){
  guideOverlay.classList.remove('open');
}

// Scroll (wheel) or swipe up anywhere brings the channel guide up on top of
// the screen — there's nothing left to scroll on the page itself.
$('guideHint').addEventListener('click', openGuideOverlay);
$('guideOverlayClose').addEventListener('click', closeGuideOverlay);
$('guideOverlayBackdrop').addEventListener('click', closeGuideOverlay);
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeGuideOverlay();
});

window.addEventListener('wheel', (e)=>{
  if(guideIsOpen()) return; // let the open panel's own list scroll normally
  openGuideOverlay();
}, {passive:true});

let touchStartY = null;
window.addEventListener('touchstart', (e)=>{
  if(guideIsOpen()) return;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
window.addEventListener('touchmove', (e)=>{
  if(touchStartY === null || guideIsOpen()) return;
  const dy = touchStartY - e.touches[0].clientY;
  if(Math.abs(dy) > 40){ openGuideOverlay(); touchStartY = null; }
}, {passive:true});

// ---- Remote-style volume + channel controls ------------------------------
const volUpBtn = $('volUp'), volDownBtn = $('volDown'), volMidBtn = $('volMid'), volVal = $('volVal');
const chUpBtn = $('chUp'), chDownBtn = $('chDown');

let volume = 10;   // 0–10 scale, shown on the remote
let isMuted = false;

function applyVolumeToPlayer(){
  if(!player || !player.setVolume) return;
  player.setVolume(volume * 10);
  if(isMuted){ if(player.mute) player.mute(); }
  else { if(player.unMute) player.unMute(); }
}

function renderVolume(){
  volVal.textContent = isMuted ? 'MUTE' : volume;
  volMidBtn.classList.toggle('muted', isMuted);
}
renderVolume();

volUpBtn.addEventListener('click', ()=>{
  volume = Math.min(10, volume + 1);
  isMuted = false;
  applyVolumeToPlayer();
  renderVolume();
});
volDownBtn.addEventListener('click', ()=>{
  volume = Math.max(0, volume - 1);
  applyVolumeToPlayer();
  renderVolume();
});
volMidBtn.addEventListener('click', ()=>{
  isMuted = !isMuted;
  applyVolumeToPlayer();
  renderVolume();
});

function channelStep(delta){
  const idx = ALL_CHANNEL_IDS.indexOf(currentChannelNum);
  const nextId = ALL_CHANNEL_IDS[(idx + delta + ALL_CHANNEL_IDS.length) % ALL_CHANNEL_IDS.length];
  tuneToChannel(nextId);
}
chUpBtn.addEventListener('click', ()=> channelStep(1));
chDownBtn.addEventListener('click', ()=> channelStep(-1));
$('chMid').addEventListener('click', openGuideOverlay);

// ---- Refresh Stream: reload the current video from scratch. Doesn't skip
// channel or song — just re-requests the same spot in the broadcast, which
// also rerolls which ad (if any) YouTube serves, in hopes of a shorter one.
const refreshBtn = $('refreshBtn');
function refreshStream(){
  if(!player) return;
  const channel = CHANNELS[currentChannelNum];
  const state = getBroadcastState(channel.songs, now());
  currentIndex = state.index;
  beginTransition();
  transitionBurst();
  renderNowPlaying();
  showBumper(channel);
  loadSong(channel.songs[currentIndex], state.offset);
}
refreshBtn.addEventListener('click', ()=>{
  refreshStream();
  refreshBtn.classList.remove('spinning');
  void refreshBtn.offsetWidth;
  refreshBtn.classList.add('spinning');
});

// ---- Jump straight into Channel 1 on load --------------------------------
if(window.YT && window.YT.Player){ createPlayer(); }
else { window.onYouTubeIframeAPIReady = createPlayer; }

// The player boots muted (see createPlayer) so autoplay isn't blocked.
// The instant the visitor does anything at all, unmute for real.
function unmuteOnFirstInteraction(){
  applyVolumeToPlayer();
}
['click','keydown','touchstart'].forEach(evt=>{
  document.addEventListener(evt, unmuteOnFirstInteraction, {once:true, passive:true});
});
</script>

</body>
