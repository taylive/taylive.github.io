<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TAYTV — Live Broadcast</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --accent: #6EC9E0;
    --accent-dim: #6EC9E033;
    --bg: #08080b;
    --panel: #101014;
    --ink: #f4f2ea;
    --ink-dim: #a8a6ac;
    --red: #ff2e4d;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    overflow:hidden;
  }

  #app{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:#000;
  }

  /* ---------- VIDEO STAGE ---------- */
  #stage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }

  #playerFrame{ position:absolute; inset:0; width:100%; height:100%; }
  #playerFrame iframe{ width:100%; height:100%; pointer-events:none; }

  /* click/interaction shield — you cannot touch the broadcast */
  #shield{ position:absolute; inset:0; z-index:5; cursor:default; background:transparent; }

  #scanlines{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.06) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:overlay; opacity:.5;
  }
  #vignette{ position:absolute; inset:0; z-index:6; pointer-events:none; box-shadow: inset 0 0 18vw 2vw rgba(0,0,0,0.55); }

  #static{
    position:absolute; inset:0; z-index:20; pointer-events:none; opacity:0;
    background:
      repeating-linear-gradient(0deg, #fff 0 1px, #000 1px 2px),
      repeating-linear-gradient(90deg, transparent 0 3px, rgba(255,255,255,.04) 3px 4px);
    background-size: 100% 3px, 6px 100%;
    filter: contrast(2) brightness(1.4);
    mix-blend-mode: screen;
  }
  #static.burst{ animation: staticBurst .6s steps(2,end) 1; }
  @keyframes staticBurst{
    0%{ opacity:.95; transform:translateY(0); }
    30%{ opacity:.75; transform:translateY(-2%); }
    60%{ opacity:.5; transform:translateY(1%); }
    100%{ opacity:0; transform:translateY(0); }
  }
  #flash{ position:absolute; inset:0; z-index:19; pointer-events:none; background:#fff; opacity:0; }
  #flash.burst{ animation: flashBurst .6s ease-out 1; }
  @keyframes flashBurst{ 0%{ opacity:.55; } 100%{ opacity:0; } }

  #bumper{
    position:absolute; inset:0; z-index:25; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    background:#08080b; opacity:0;
  }
  #bumper .bumper-logo{ font-family:'Anton', sans-serif; font-size:clamp(28px, 6vw, 56px); letter-spacing:2px; color:var(--ink); }
  #bumper .bumper-logo span{ color:var(--accent); }
  #bumper .bumper-ch{
    margin-top:10px; font-family:'JetBrains Mono', monospace; font-size:12px;
    letter-spacing:3px; color:var(--ink-dim); text-transform:uppercase;
  }

  /* ---------- TUNE-IN SPLASH ---------- */
  #splash{
    position:absolute; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; text-align:center;
    background: radial-gradient(ellipse at 50% 20%, var(--accent-dim), transparent 60%), #08080b;
    transition: opacity .5s ease, visibility .5s ease;
  }
  #splash.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .splash-logo{ font-family:'Anton', sans-serif; font-size:clamp(40px, 9vw, 88px); letter-spacing:2px; line-height:.95; color:var(--ink); }
  .splash-logo span{ color:var(--accent); }
  .splash-sub{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:4px; text-transform:uppercase; color:var(--ink-dim); }
  .splash-nowplaying{ font-size:14px; color:var(--ink-dim); display:flex; align-items:center; gap:8px; }
  .splash-nowplaying b{ color:var(--ink); font-weight:700; }
  #tuneBtn{
    margin-top:8px; font-family:'Anton', sans-serif; font-size:18px; letter-spacing:3px;
    color:#08080b; background:var(--accent); border:none; padding:16px 40px; border-radius:999px;
    cursor:pointer; box-shadow:0 0 0 0 var(--accent-dim); transition: transform .15s ease, box-shadow .3s ease;
  }
  #tuneBtn:hover{ transform:scale(1.04); box-shadow:0 0 40px 6px var(--accent-dim); }
  #tuneBtn:active{ transform:scale(0.98); }

  /* ---------- ON-SCREEN CHROME (auto-hides) ---------- */
  #chrome{ transition: opacity .5s ease; opacity:1; }
  #chrome.faded{ opacity:0; }

  #bug{
    position:absolute; top:22px; left:22px; z-index:15;
    display:flex; align-items:center; gap:10px;
    font-family:'Anton', sans-serif; letter-spacing:1px;
    padding:8px 14px 8px 10px; background:rgba(8,8,11,0.55); backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.08); border-radius:8px;
  }
  #bug .num{
    font-size:11px; color:var(--accent); font-family:'JetBrains Mono', monospace;
    letter-spacing:0; border-right:1px solid rgba(255,255,255,.15); padding-right:9px;
  }
  #bug .name{ font-size:15px; }
  #bug .name span{ color:var(--accent); }

  #live{
    position:absolute; top:22px; right:22px; z-index:15;
    display:flex; align-items:center; gap:14px;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-dim);
  }
  #live .dot-wrap{ display:flex; align-items:center; gap:6px; color:var(--red); font-weight:700; letter-spacing:1px; }
  #live .dot{ width:8px; height:8px; border-radius:50%; background:var(--red); animation: pulse 1.4s infinite ease-in-out; }
  @keyframes pulse{
    0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(255,46,77,.5); }
    50%{ opacity:.55; box-shadow:0 0 0 6px rgba(255,46,77,0); }
  }
  #clock{ letter-spacing:1px; }
  #viewers{ letter-spacing:.5px; }

  #guideHint{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:15;
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:var(--ink-dim); background:rgba(8,8,11,0.5); backdrop-filter: blur(6px);
    padding:7px 14px; border-radius:999px; border:1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; gap:8px;
  }
  #guideHint svg{ width:12px; height:12px; }

  #lowerthird{ position:absolute; left:0; right:0; bottom:60px; z-index:15; pointer-events:none; }
  #nowbar{ margin:0 22px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; }
  #nowplaying-block{
    background:rgba(8,8,11,0.62); backdrop-filter: blur(8px); border-left:4px solid var(--accent);
    border-radius:4px; padding:12px 18px; max-width:70%;
  }
  #np-eyebrow{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; margin-bottom:4px; }
  #np-title{ font-family:'Anton', sans-serif; font-size:clamp(20px,3.4vw,34px); letter-spacing:.5px; line-height:1; }
  #np-era{ margin-top:4px; font-size:12px; color:var(--ink-dim); font-weight:600; }
  #upnext-block{
    background:rgba(8,8,11,0.5); backdrop-filter: blur(8px); border-radius:4px;
    padding:10px 16px; text-align:right; min-width:180px;
  }
  #upnext-block.hidden{ display:none; }
  #un-eyebrow{ font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:2px; color:var(--ink-dim); text-transform:uppercase; margin-bottom:3px; }
  #un-title{ font-size:14px; font-weight:700; }

  /* ---------- CHANNEL GUIDE ---------- */
  #guideBackdrop{
    position:absolute; inset:0; z-index:40; background:rgba(0,0,0,0.5);
    opacity:0; pointer-events:none; transition:opacity .35s ease;
  }
  #guideBackdrop.open{ opacity:1; pointer-events:auto; }

  #guide{
    position:absolute; top:0; right:0; bottom:0; z-index:41;
    width:min(420px, 92vw); background:rgba(10,10,13,0.92); backdrop-filter: blur(14px);
    border-left:1px solid rgba(255,255,255,0.08);
    transform:translateX(100%); transition: transform .4s cubic-bezier(.22,.9,.32,1);
    display:flex; flex-direction:column;
  }
  #guide.open{ transform:translateX(0); }

  #guideHeader{
    padding:22px 22px 14px 22px; border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:space-between;
  }
  #guideHeader h2{ font-family:'Anton', sans-serif; font-size:20px; letter-spacing:1px; }
  #guideClose{
    background:none; border:1px solid rgba(255,255,255,0.15); color:var(--ink-dim);
    width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:16px; line-height:1;
  }
  #guideClose:hover{ color:var(--ink); border-color:rgba(255,255,255,0.35); }

  #guideList{ flex:1; overflow-y:auto; padding:10px 0 24px 0; }
  .guide-group-label{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:3px; color:var(--ink-dim);
    text-transform:uppercase; padding:16px 22px 8px 22px;
  }
  .guide-row{
    display:flex; align-items:center; gap:14px; padding:11px 22px; cursor:pointer;
    border-left:3px solid transparent; transition: background .15s ease;
  }
  .guide-row:hover{ background:rgba(255,255,255,0.04); }
  .guide-row.active{ background:var(--accent-dim); border-left-color:var(--accent); }
  .guide-ch-num{
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--ink-dim);
    width:38px; flex:0 0 auto;
  }
  .guide-row.active .guide-ch-num{ color:var(--accent); font-weight:700; }
  .guide-ch-info{ flex:1; min-width:0; }
  .guide-ch-name{ font-size:14px; font-weight:700; }
  .guide-ch-now{ font-size:11px; color:var(--ink-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  @media (max-width:640px){
    #bug .name{ font-size:12px; }
    #bug .num{ font-size:9px; padding-right:6px; }
    #live{ font-size:10px; gap:8px; }
    #nowbar{ flex-direction:column; align-items:flex-start; }
    #nowplaying-block{ max-width:100%; }
    #upnext-block{ text-align:left; }
    #np-title{ font-size:20px; }
    #guideHint{ font-size:9px; padding:6px 12px; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="stage">
    <div id="playerFrame"></div>
    <div id="shield"></div>

  </div>

      Scroll for Guide
    </div>
  </div>

  <div id="guideBackdrop"></div>
  <div id="guide">
    <div id="guideHeader">

    </div>
    <div id="guideList"></div>

  <div id="splash">

  </div>

</div>

   TAYTV — a multi-channel, 24/7 "always-on" broadcast network.
   Every channel runs on its own fixed, wall-clock-driven schedule (like
   real live TV): whichever channel you tune to, you land mid-song, right
   where the broadcast "actually is" — there's no pause/seek, and each
   channel just keeps rolling forever.
   ========================================================================= */

const GUIDE_ORDER = [
  { label:"ON AIR NOW", ids:[1,2,3] },
  { label:"ALBUM RADIO", ids:[101,102,103,104,105,106,107,108,109,110,111,112] },
  { label:"ALBUM LYRICS", ids:[208,209,210,211,212] },
];
const ALL_CHANNEL_IDS = GUIDE_ORDER.flatMap(g=>g.ids);

// ---- SCHEDULE MATH ------------------------------------------------------
function getBroadcastState(songs, atTime){
  const total = songs.reduce((s,v)=>s+v.duration,0);
  const elapsed = ((atTime - EPOCH) / 1000) % total;
  let acc = 0;
  for(let i=0;i<songs.length;i++){
    if(elapsed < acc + songs[i].duration){
      return { index:i, offset: elapsed - acc };
    }
    acc += songs[i].duration;
  }
  return { index:0, offset:0 };
}

// ---- DOM refs -------------------------------------------------------------
const $ = (id)=>document.getElementById(id);
const npTitle = $('np-title'), npEra = $('np-era'), unTitle = $('un-title'), upnextBlock = $('upnext-block');
const splashCurrent = $('splash-current'), clockEl = $('clock'), viewersEl = $('viewers');
const staticEl = $('static'), flashEl = $('flash');
const bumperEl = $('bumper'), bumperCh = $('bumperCh');
const bugNum = $('bugNum');
const chromeEl = $('chrome');
const root = document.documentElement;

function showBumper(holdMs, channel){
  bumperCh.textContent = "CH. " + channel.number + " · " + channel.name;
  bumperEl.style.transition = 'none';
  bumperEl.style.opacity = '1';
  void bumperEl.offsetWidth;
  setTimeout(()=>{
    bumperEl.style.transition = 'opacity .6s ease';
    bumperEl.style.opacity = '0';
  }, holdMs);
}

function applyEra(song){
  root.style.setProperty('--accent', song.accent);
  root.style.setProperty('--accent-dim', song.accent + '33');
}

function renderNowPlaying(){
  const channel = CHANNELS[currentChannelNum];
  const songs = channel.songs;
  const song = songs[currentIndex];
  const next = songs[(currentIndex+1) % songs.length];
  applyEra(song);
  bugNum.textContent = "CH." + channel.number;
  npTitle.textContent = song.title;
  npEra.textContent = "CH." + channel.number + " · " + channel.name + " · " + song.era;
  if(songs.length > 1){
    upnextBlock.classList.remove('hidden');
    unTitle.textContent = next.title;
  } else {
    upnextBlock.classList.add('hidden');
  }
  splashCurrent.textContent = song.title + " — CH." + channel.number;
  document.title = "🔴 CH." + channel.number + " " + song.title + " — TAYTV";
}

// ---- Clock + fake viewer count ---------------------------------------
function tickClock(){
  clockEl.textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tickClock, 1000);
tickClock();

let viewerBase = 8400 + Math.floor(Math.random()*3000);
function tickViewers(){
  viewerBase += Math.floor(Math.random()*90) - 40;
  if(viewerBase < 1000) viewerBase = 1000;
  viewersEl.textContent = viewerBase.toLocaleString() + " watching";
}
setInterval(tickViewers, 2500);
tickViewers();

// initial "what's on now" for the splash screen, before the user even taps in
let currentChannelNum = 1;
let currentIndex = getBroadcastState(CHANNELS[1].songs, Date.now()).index;
renderNowPlaying();

// ---- YouTube IFrame API -------------------------------------------------
let player = null;
let resyncInterval = null;
// Songs that turn out broken/non-embeddable get blacklisted per-channel for
// the rest of the session, so a channel just routes around them forever.
const deadIndices = {};
function deadSet(chNum){ if(!deadIndices[chNum]) deadIndices[chNum] = new Set(); return deadIndices[chNum]; }

window.onYouTubeIframeAPIReady = function(){ /* player created on tune-in */ };
(function loadYT(){
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);
})();

function createPlayer(){
  const channel = CHANNELS[currentChannelNum];
  const state = getBroadcastState(channel.songs, Date.now());
  currentIndex = state.index;
  renderNowPlaying();
  showBumper(2200, channel);

  player = new YT.Player('playerFrame', {
    host: 'https://www.youtube-nocookie.com',
    videoId: channel.songs[currentIndex].id,
    playerVars: {
      autoplay: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, fs: 0,
      iv_load_policy: 3, cc_load_policy: 0, playsinline: 1,
      start: Math.floor(state.offset), origin: window.location.origin
    },
    events: {
      onReady: (e)=>{ e.target.playVideo(); startResync(); },
      onStateChange: onPlayerStateChange,
      onApiChange: (e)=>{
        try{
          const opts = e.target.getOptions();
          if(opts && opts.indexOf && opts.indexOf('captions') !== -1){
            e.target.setOption('captions', 'track', {});
            e.target.unloadModule('captions');
          }
        }catch(err){}
      },
      onError: ()=> advanceToNext(true)
    }
  });
}

function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.ENDED) advanceToNext(false);
  if(e.data === YT.PlayerState.PAUSED) e.target.playVideo(); // live TV can't be paused
}

function transitionBurst(){
  staticEl.classList.remove('burst'); flashEl.classList.remove('burst');
  void staticEl.offsetWidth;
  staticEl.classList.add('burst'); flashEl.classList.add('burst');
}

function nextLiveIndex(chNum, fromIndex){
  const songs = CHANNELS[chNum].songs;
  const dead = deadSet(chNum);
  if(dead.size >= songs.length) return -1;
  let i = fromIndex;
  do{ i = (i + 1) % songs.length; } while(dead.has(i));
  return i;
}

function advanceToNext(fromError){
  if(fromError) deadSet(currentChannelNum).add(currentIndex);
  const next = nextLiveIndex(currentChannelNum, currentIndex);
  if(next === -1){
    npTitle.textContent = "Technical Difficulties";
    npEra.textContent = "Please check back shortly";
    return;
  }
  transitionBurst();
  currentIndex = next;
  const channel = CHANNELS[currentChannelNum];
  renderNowPlaying();
  showBumper(2200, channel);
  setTimeout(()=>{
    if(player && player.loadVideoById){
      player.loadVideoById({ videoId: channel.songs[currentIndex].id, startSeconds: 0 });
    }
  }, fromError ? 400 : 250);
}

// Keep the broadcast honest to the wall clock on the current channel.
function startResync(){
  if(resyncInterval) clearInterval(resyncInterval);
  resyncInterval = setInterval(()=>{
    if(!player || !player.getCurrentTime) return;
    const channel = CHANNELS[currentChannelNum];
    const state = getBroadcastState(channel.songs, Date.now());
    if(state.index !== currentIndex && !deadSet(currentChannelNum).has(state.index)){
      currentIndex = state.index;
      renderNowPlaying();
      showBumper(2200, channel);
      player.loadVideoById({ videoId: channel.songs[currentIndex].id, startSeconds: Math.floor(state.offset) });
      return;
    }
    const drift = Math.abs(player.getCurrentTime() - state.offset);
    if(drift > 4) player.seekTo(state.offset, true);
  }, 5000);
}

function tuneToChannel(num){
  if(num === currentChannelNum) return;
  currentChannelNum = num;
  const channel = CHANNELS[num];
  const state = getBroadcastState(channel.songs, Date.now());
  currentIndex = state.index;
  transitionBurst();
  renderNowPlaying();
  showBumper(2200, channel);
  if(player && player.loadVideoById){
    player.loadVideoById({ videoId: channel.songs[currentIndex].id, startSeconds: Math.floor(state.offset) });
  }
  renderGuideList();
}

// ---- Interaction shield: no pausing, no seeking, no right-click --------
const shield = $('shield');
shield.addEventListener('click', (e)=>e.preventDefault());
shield.addEventListener('contextmenu', (e)=>e.preventDefault());
document.addEventListener('keydown', (e)=>{
  if([' ','k','K','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});

// ---- Auto-hiding chrome: bug / live badge / lower third ----------------
let chromeTimer = null;
function wakeChrome(){
  chromeEl.classList.remove('faded');
  clearTimeout(chromeTimer);
  chromeTimer = setTimeout(()=> chromeEl.classList.add('faded'), 3800);
}
['mousemove','mousedown','touchstart','keydown'].forEach(evt=>{
  document.addEventListener(evt, wakeChrome, {passive:true});
});
wakeChrome();

// ---- Channel guide: opens on scroll (wheel) or swipe --------------------
const guideEl = $('guide'), guideBackdrop = $('guideBackdrop'), guideList = $('guideList');
let guideTimer = null;

function renderGuideList(){
  guideList.innerHTML = '';
  GUIDE_ORDER.forEach(group=>{
    const label = document.createElement('div');
    label.className = 'guide-group-label';
    label.textContent = group.label;
    guideList.appendChild(label);
    group.ids.forEach(id=>{
      const channel = CHANNELS[id];
      const state = getBroadcastState(channel.songs, Date.now());
      const nowSong = channel.songs[state.index];
      const row = document.createElement('div');
      row.className = 'guide-row' + (id === currentChannelNum ? ' active' : '');
      row.innerHTML =
        '<div class="guide-ch-num">' + id + '</div>' +
        '<div class="guide-ch-info">' +
          '<div class="guide-ch-name">' + channel.name + '</div>' +
          '<div class="guide-ch-now">NOW: ' + nowSong.title + '</div>' +
        '</div>';
      row.addEventListener('click', ()=>{ tuneToChannel(id); closeGuide(); });
      guideList.appendChild(row);
    });
  });
}

function openGuide(){
  renderGuideList();
  guideEl.classList.add('open');
  guideBackdrop.classList.add('open');
  clearTimeout(guideTimer);
  guideTimer = setTimeout(closeGuide, 6000);
}
function closeGuide(){
  guideEl.classList.remove('open');
  guideBackdrop.classList.remove('open');
  clearTimeout(guideTimer);
}
function guideIsOpen(){ return guideEl.classList.contains('open'); }

window.addEventListener('wheel', (e)=>{
  if(guideEl.contains(e.target)) return; // let internal list scroll normally
  openGuide();
}, {passive:true});

let touchStartY = null;
window.addEventListener('touchstart', (e)=>{
  if(guideEl.contains(e.target)) return;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
window.addEventListener('touchmove', (e)=>{
  if(touchStartY === null || guideEl.contains(e.target)) return;
  const dy = touchStartY - e.touches[0].clientY;
  if(Math.abs(dy) > 40){ openGuide(); touchStartY = null; }
}, {passive:true});

guideList.addEventListener('mouseenter', ()=> clearTimeout(guideTimer));
guideList.addEventListener('mouseleave', ()=>{
  clearTimeout(guideTimer);
  guideTimer = setTimeout(closeGuide, 6000);
});
$('guideClose').addEventListener('click', closeGuide);
guideBackdrop.addEventListener('click', closeGuide);

// ---- Tune-in splash ------------------------------------------------------
$('tuneBtn').addEventListener('click', ()=>{
  $('splash').classList.add('hidden');
  if(window.YT && window.YT.Player){ createPlayer(); }
  else { window.onYouTubeIframeAPIReady = createPlayer; }
});
</script>
